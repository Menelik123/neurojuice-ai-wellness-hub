<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <title>NeuroJuice – AI Personalized Juice Blends</title>
    <meta name="description" content="Discover NeuroJuice: AI-driven personalized juice blends tailored for your wellness goals. Fresh, nutritious, and designed just for you." />
    <meta name="author" content="NeuroJuice" />
    <meta name="keywords" content="personalized juice, AI nutrition, healthy drinks, fresh juice, wellness, custom blends" />

    <meta property="og:title" content="NeuroJuice – AI Personalized Juice Blends" />
    <meta property="og:description" content="AI-driven juice blends tailored for your goals. Personalized wellness in every sip." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Global NeuroJuice Configuration
      window.NJ_CONFIG = {
        VITAL_PAYWALL_MODE: "trial",   // "paid" | "trial" | "free"
        TRIAL_LENGTH_DAYS: 14,
        MEMBER_DISCOUNT_PCT: 0.20,
        REGULAR_PRICE: 7.99
      };

      // Global NeuroJuice State
      window.NJ = {
        isMember: false,
        hasVitalTrial: false,
        trialEndsAt: null,
        memberEmail: null
      };

      // Initialize state from localStorage
      try {
        const savedEmail = localStorage.getItem('nj_memberEmail');
        const savedMember = localStorage.getItem('nj_isMember');
        const savedTrial = localStorage.getItem('nj_hasVitalTrial');
        const savedTrialEnd = localStorage.getItem('nj_trialEndsAt');
        
        if (savedEmail) window.NJ.memberEmail = savedEmail;
        if (savedMember === 'true') window.NJ.isMember = true;
        if (savedTrial === 'true') window.NJ.hasVitalTrial = true;
        if (savedTrialEnd) window.NJ.trialEndsAt = new Date(savedTrialEnd);
      } catch (e) {
        console.warn('Failed to load NJ state from localStorage:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
